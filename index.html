<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="title">
            Survey Form
        </h1>

        <p id="description">
            Thank you for your time
        </p>
    </header>
    
    <main>
        <form action="https://www.freecodecamp.com/email-submit" id="survey-form">
            <!-- name -->
            <label for="name" id="name-label">Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required name="name">

            <!-- email -->
            <label for="email" id="email-label">Email:</label>
            <input type="email" id="email" placeholder="john@gmail.com" required name="email">

            <!-- age -->
            <label for="number" id="number-label">Age:</label>
            <input type="number" id="number" min="15" max="60" placeholder="Enter your age" required name="age">

            <!-- gender -->
            <label for="gender">Select your gender:</label>
            <div class="gender">
                <div>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                </div>
                <div>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
            </div>

            <!-- checkboxes -->
            <label>Which languages do you know?</label>
            <div class="languages">
                <div>
                    <input type="checkbox" id="HTML" name="language" value="HTML">
                    <label for="HTML">HTML</label>
                </div>
                <div>
                    <input type="checkbox" id="CSS" name="language" value="CSS">
                    <label for="CSS">CSS</label>
                </div>
                <div>
                    <input type="checkbox" id="JavaScript" name="language" value="JavaScript">
                    <label for="JavaScript">JavaScript</label>
                </div>
                <div>
                    <input type="checkbox" id="React" name="language" value="React">
                    <label for="React">React</label>
                </div>
            </div>

            <!-- dropdown -->
            <label for="dropdown">Current Role:</label>
            <select id="dropdown" required name="role">
                <option value="" disabled selected>Select your role</option>
                <option value="student">Student</option>
                <option value="job">Full-time Job</option>
            </select>

            <!-- text area -->
            <label for="thoughts">Your thoughts:</label>
            <textarea name="thoughts" id="thoughts" rows="4" placeholder="Share your experience..."></textarea>

            <!-- submit btn -->
            <button id="submit" type="submit">Submit</button>  
        </form> 
    </main>
    </body>
</html>
